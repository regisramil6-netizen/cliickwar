<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CLICKWAR ULTIMATE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --accent: #ff4d4d; --gold: #ffd700; }
        body { 
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%); 
            color: white; font-family: 'Segoe UI', sans-serif; 
            text-align: center; margin: 0; padding: 15px; 
            overflow: hidden; user-select: none;
            touch-action: manipulation; /* Убирает задержку клика в мобильных браузерах */
        }
        
        .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .user-info { display: flex; align-items: center; background: rgba(255,255,255,0.05); padding: 5px 12px; border-radius: 20px; border: 1px solid #333; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; margin-right: 10px; border: 2px solid var(--accent); object-fit: cover; }
        
        .circle-btn { background: rgba(255,255,255,0.1); border: 1px solid #444; border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; }

        .stats-panel { background: rgba(255,255,255,0.08); border-radius: 20px; padding: 15px; border: 1px solid #444; }
        .balance { color: var(--gold); font-size: 34px; font-weight: bold; }
        .energy-container { width: 100%; height: 14px; background: #222; border-radius: 10px; margin-top: 10px; border: 1px solid #444; overflow: hidden; }
        #energy-bar { width: 100%; height: 100%; background: linear-gradient(90deg, var(--accent), #ff8e8e); transition: width 0.2s ease; }

        /* ВСПЫШКА НА ВЕСЬ ЭКРАН */
        #flash { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3) 0%, transparent 70%); 
            opacity: 0; pointer-events: none; z-index: 5; 
        }

        #boss-container { position: relative; display: inline-block; margin: 30px 0; }
        #boss { 
            width: 220px; z-index: 10; cursor: pointer; border-radius: 20px;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            -webkit-tap-highlight-color: transparent;
        }
        /* Эффект прожатия */
        #boss.pressed { transform: scale(0.85); }

        .shop { display: flex; justify-content: center; gap: 10px; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid #333; padding: 12px; border-radius: 18px; width: 48%; }
        button { background: #28a745; color: white; border: none; padding: 10px; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 5px; cursor: pointer; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 2000; padding: 20px; box-sizing: border-box; }
        .modal-content { background: #1a1a1a; border-radius: 25px; padding: 25px; border: 1px solid var(--accent); max-height: 85vh; overflow-y: auto; }
        
        .dmg { position: fixed; color: var(--gold); font-weight: bold; font-size: 30px; pointer-events: none; animation: fly 0.6s ease-out forwards; z-index: 3000; }
        @keyframes fly { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
    </style>
</head>
<body>

    <div id="flash"></div>

    <div class="header-box">
        <div class="user-info" onclick="showModal('profile-modal')">
            <img id="avatar" class="user-avatar" src="https://img.icons8.com/ios-filled/50/ff4d4d/user-male-circle.png">
            <span id="un">...</span>
        </div>
        <div class="nav-btns" style="display:flex; gap:8px;">
            <div class="circle-btn" onclick="showModal('bonus-modal')">🎁</div>
            <div class="circle-btn" onclick="showModal('rank-modal'); loadRank();">🏆</div>
        </div>
    </div>

    <div class="stats-panel">
        <div class="balance">🪙 <span id="bl">0</span></div>
        <div class="energy-container"><div id="energy-bar"></div></div>
        <div style="font-size:12px; margin-top:5px;"><span id="cur-e">0</span> / <span id="max-e">300</span></div>
    </div>

    <div id="boss-container">
        <img id="boss" src="boss.png" ontouchstart="hit(event)" onmousedown="hit(event)">
    </div>

    <div class="shop">
        <div class="card"><small id="lvlP">LVL 1</small><br>Урон +1<button id="b1" onclick="buy('p')">50</button></div>
        <div class="card"><small id="lvlE">LVL 1</small><br>Энергия +10<button id="b2" onclick="buy('e')">100</button></div>
    </div>

    <div id="profile-modal" class="modal"><div class="modal-content"><h2>ПРОФИЛЬ</h2><p>Рефералы: <b id="st-refs">0</b></p><button onclick="copyRef()">ССЫЛКА</button><br><button onclick="closeModal('profile-modal')">ЗАКРЫТЬ</button></div></div>
    <div id="bonus-modal" class="modal"><div class="modal-content"><h2>БОНУС</h2><div id="bonus-grid"></div><button id="claim-btn" onclick="claimDaily()">ЗАБРАТЬ</button><br><button onclick="closeModal('bonus-modal')">ЗАКРЫТЬ</button></div></div>
    <div id="rank-modal" class="modal"><div class="modal-content"><h2>ТОП</h2><div id="rank-list"></div><br><button onclick="closeModal('rank-modal')">ЗАКРЫТЬ</button></div></div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const sb = supabase.createClient("https://oniwtglhvsczfmgijeco.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uaXd0Z2xodnNjemZtZ2lqZWNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNjMzNTgsImV4cCI6MjA4NjczOTM1OH0.2ETnTI6c7Lw1qKvarX5fDp1RXyvBz8cqlR7YYyjYzHs");

    const user = tg.initDataUnsafe?.user || {id: 777, first_name: "Игрок"};
    document.getElementById('un').innerText = user.first_name;

    let s = { 
        bl: 0, p: 1, cP: 50, e: 300, maxE: 300, cE: 100, 
        lvlP: 1, lvlE: 1, lastBonus: 0, bonusDay: 0, refs: 0,
        lastExit: Date.now() // Запоминаем время
    };

    async function loadData() {
        const local = localStorage.getItem('cw_v10');
        if (local) s = {...s, ...JSON.parse(local)};

        try {
            const { data } = await sb.from('leaderboard').select('*').eq('id', user.id).single();
            if (data) {
                s.bl = data.score || s.bl;
                s.refs = data.refs || 0;
                s.maxE = data.maxE || 300;
            }
        } catch(e) {}

        // ВОССТАНОВЛЕНИЕ В ОФЛАЙНЕ
        const now = Date.now();
        const secondsOffline = Math.floor((now - s.lastExit) / 1000);
        const recoveryPerSec = (s.maxE * 0.01) / 5; // 1% каждые 5 сек
        s.e = Math.min(s.maxE, s.e + (secondsOffline * recoveryPerSec));

        upd();
    }

    function upd() {
        s.lastExit = Date.now(); // Обновляем время активности
        document.getElementById('bl').innerText = Math.floor(s.bl).toLocaleString();
        document.getElementById('cur-e').innerText = Math.floor(s.e);
        document.getElementById('max-e').innerText = s.maxE;
        document.getElementById('energy-bar').style.width = (s.e / s.maxE * 100) + "%";
        document.getElementById('st-refs').innerText = s.refs;
        localStorage.setItem('cw_v10', JSON.stringify(s));
    }

    function hit(e) {
        e.preventDefault();
        if(s.e < s.p) return;

        s.e -= s.p; s.bl += s.p;

        // Анимация прожатия
        const b = document.getElementById('boss');
        b.classList.add('pressed');
        setTimeout(() => b.classList.remove('pressed'), 100);

        // Вспышка
        const f = document.getElementById('flash');
        f.style.opacity = "1";
        setTimeout(() => f.style.opacity = "0", 100);

        // Число урона
        const d = document.createElement('div');
        d.className='dmg'; d.innerText=`+${s.p}`;
        const rect = b.getBoundingClientRect();
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        d.style.left=`${x-15}px`; d.style.top=`${y-15}px`;
        document.body.appendChild(d);
        setTimeout(()=>d.remove(), 600);

        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        upd();
    }

    // Сохранение при выходе/сворачивании
    window.addEventListener('blur', () => { s.lastExit = Date.now(); saveDB(); });

    async function saveDB() {
        try { await sb.from('leaderboard').upsert({ id: user.id, name: user.first_name, score: Math.floor(s.bl), refs: s.refs, maxE: s.maxE }); } catch(e) {}
    }

    setInterval(() => { if(s.e < s.maxE) { s.e = Math.min(s.maxE, s.e + (s.maxE * 0.01)); upd(); } }, 5000);
    setInterval(saveDB, 15000);

    function showModal(id) { document.getElementById(id).style.display='block'; }
    function closeModal(id) { document.getElementById(id).style.display='none'; }

    loadData();
</script>
</body>
</html>
