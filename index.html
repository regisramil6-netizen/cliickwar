<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CLICKWAR</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: sans-serif;
      text-align: center;
      margin: 0; padding: 15px;
      overflow: hidden;
      user-select: none;
    }
    .user-card {
      background: rgba(255,255,255,0.1);
      padding: 10px; border-radius: 12px;
      display: flex; align-items: center; margin-bottom: 20px;
    }
    #user-name { font-weight: bold; margin-left: 10px; }
    
    h1 { color: #ff4d4d; margin: 10px 0; font-size: 22px; }
    
    .stats { background: #1a1a1a; padding: 15px; border-radius: 15px; border: 1px solid #333; }
    
    #boss-container { position: relative; margin: 30px 0; display: inline-block; }
    #boss { width: 220px; cursor: pointer; transition: transform 0.05s; z-index: 5; position: relative; }
    #boss:active { transform: scale(0.95); }

    .magic-circle {
      position: absolute; top: 50%; left: 50%; width: 300px; height: 300px;
      margin-top: -150px; margin-left: -150px;
      background: url('https://img.icons8.com/ios/150/ff4d4d/sacred-geometry.png') no-repeat center;
      background-size: contain; opacity: 0.2; animation: rot 20s linear infinite;
    }
    @keyframes rot { from {transform: rotate(0deg)} to {transform: rotate(360deg)} }

    .shop { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
    .item { background: #222; padding: 10px; border-radius: 10px; width: 40%; border: 1px solid #444; }
    button { background: #28a745; color: white; border: none; width: 100%; padding: 8px; border-radius: 5px; margin-top: 5px; font-weight: bold; }
    button:disabled { background: #444; }
  </style>
</head>
<body>

<div class="user-card">
    <div id="user-name">Игрок</div>
</div>

<h1>🔥 CLICKWAR 🔥</h1>

<div class="stats">
    <div>❤️ HP: <span id="hp">1.000.000.000.000</span></div>
    <div style="color: #ffd700; font-size: 20px; margin-top: 5px;">🪙 <span id="bal">0</span> CW</div>
</div>

<div id="boss-container">
    <div class="magic-circle"></div>
    <img id="boss" src="boss.png" onclick="hit(event)" />
</div>

<div class="shop">
    <div class="item">Урон +1<button id="btn1" onclick="buy('pwr')">50</button></div>
    <div class="item">Авто +1<button id="btn2" onclick="buy('auto')">150</button></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Проверка имени пользователя
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
    }

    // Состояние
    let data = {
        hp: 1000000,
        bal: 0,
        pwr: 1,
        auto: 0,
        cost1: 50,
        cost2: 150
    };

    // Загрузка
    const saved = localStorage.getItem('cw_save');
    if (saved) data = JSON.parse(saved);

    function update() {
        document.getElementById('hp').innerText = Math.floor(data.hp).toLocaleString();
        document.getElementById('bal').innerText = Math.floor(data.bal).toLocaleString();
        document.getElementById('btn1').innerText = data.cost1;
        document.getElementById('btn2').innerText = data.cost2;
        
        document.getElementById('btn1').disabled = data.bal < data.cost1;
        document.getElementById('btn2').disabled = data.bal < data.cost2;
        
        localStorage.setItem('cw_save', JSON.stringify(data));
    }

    function hit(e) {
        data.hp -= data.pwr;
        data.bal += data.pwr;
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        update();
    }

    function buy(type) {
        if (type === 'pwr' && data.bal >= data.cost1) {
            data.bal -= data.cost1;
            data.pwr += 1;
            data.cost1 = Math.floor(data.cost1 * 1.5);
        } else if (type === 'auto' && data.bal >= data.cost2) {
            data.bal -= data.cost2;
            data.auto += 1;
            data.cost2 = Math.floor(data.cost2 * 1.6);
        }
        update();
    }

    setInterval(() => {
        if (data.auto > 0) {
            data.hp -= data.auto;
            data.bal += data.auto;
            update();
        }
    }, 1000);

    update();
</script>

</body>
</html>
