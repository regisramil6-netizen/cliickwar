<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CLICKWAR ENERGY</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: radial-gradient(circle, #1a1a1a 0%, #000 100%); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 15px; overflow: hidden; user-select: none; }
        
        .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .user-header { background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 12px; border: 1px solid #333; font-size: 14px; }
        .rank-btn { background: rgba(255, 215, 0, 0.1); border: 1px solid #ffd700; border-radius: 12px; padding: 8px 12px; cursor: pointer; font-size: 20px; transition: 0.3s; }
        .rank-btn:active { transform: scale(1.2); }

        /* СТАТИСТИКА И ПОЛОСА */
        .stats-panel { background: rgba(255,255,255,0.08); border-radius: 20px; padding: 15px; border: 1px solid #444; }
        .balance { color: #ffd700; font-size: 32px; font-weight: bold; text-shadow: 0 0 10px rgba(255,215,0,0.3); }
        
        .energy-container { width: 100%; height: 12px; background: #222; border-radius: 10px; margin-top: 10px; overflow: hidden; border: 1px solid #444; }
        #energy-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4d4d, #ff8e8e); transition: width 0.1s linear; }

        /* БОСС И ЭФФЕКТЫ */
        #boss-container { position: relative; display: inline-block; margin: 50px 0; }
        #boss { width: 240px; position: relative; z-index: 10; transition: transform 0.05s; cursor: pointer; filter: drop-shadow(0 0 15px rgba(255,77,77,0.4)); }
        #boss:active { transform: scale(0.9); }

        .magic-circle { 
            position: absolute; top: 50%; left: 50%; width: 450px; height: 450px; 
            margin-top: -225px; margin-left: -225px; 
            background: url('https://img.icons8.com/ios/150/ff4d4d/sacred-geometry.png') no-repeat center; 
            background-size: contain; opacity: 0.2; animation: rot 15s linear infinite; z-index: 1; 
        }
        @keyframes rot { from {transform:rotate(0deg)} to {transform:rotate(360deg)} }

        /* МАГАЗИН */
        .shop { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid #333; padding: 12px; border-radius: 18px; width: 140px; }
        button { background: #28a745; color: white; border: none; padding: 10px; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 8px; cursor: pointer; font-size: 16px; }
        button:disabled { background: #333; color: #666; cursor: default; }

        /* АНИМАЦИЯ ВЫЛЕТА МОНЕТ */
        .dmg { position: fixed; color: #ffd700; font-weight: bold; font-size: 36px; pointer-events: none; animation: fly 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; z-index: 1000; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        @keyframes fly { 
            0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-150px) scale(1.5) rotate(15deg); }
        }

        /* ОКНО РЕЙТИНГА */
        #ov { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 2000; }
        .win { background: #1a1a1a; margin: 40px auto; width: 85%; border-radius: 25px; padding: 25px; border: 1px solid #ff4d4d; }
        .item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #333; font-size: 18px; }
    </style>
</head>
<body>
    <div class="header-box">
        <div class="user-header" id="un">⚔️ Игрок</div>
        <div class="rank-btn" onclick="showRank()">🏆</div>
    </div>

    <div class="stats-panel">
        <div class="balance">🪙 <span id="bl">0</span></div>
        <div style="font-size:12px; opacity:0.6; margin-top:5px; letter-spacing:1px;">ЭНЕРГИЯ КЛИКОВ</div>
        <div class="energy-container">
            <div id="energy-bar"></div>
        </div>
        <div id="energy-text" style="font-size:12px; margin-top:5px;">300 / 300</div>
    </div>

    <div id="boss-container">
        <div class="magic-circle"></div>
        <img id="boss" src="boss.png" onmousedown="hit(event)" ontouchstart="hit(event)">
    </div>

    <div class="shop">
        <div class="card">Урон +1<button id="b1" onclick="buy('p')">50</button></div>
        <div class="card">Авто +1<button id="b2" onclick="buy('a')">150</button></div>
    </div>

    <div id="ov">
        <div class="win">
            <h2 style="color:#ffd700">🏆 ТОП ЛИДЕРОВ</h2>
            <div id="list">Загрузка...</div>
            <button onclick="document.getElementById('ov').style.display='none'" style="background:#ff4d4d; margin-top:20px;">ЗАКРЫТЬ</button>
        </div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const SB_URL = "https://oniwtglhvsczfmgijeco.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uaXd0Z2xodnNjemZtZ2lqZWNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNjMzNTgsImV4cCI6MjA4NjczOTM1OH0.2ETnTI6c7Lw1qKvarX5fDp1RXyvBz8cqlR7YYyjYzHs";
    const sb = supabase.createClient(SB_URL, SB_KEY);

    const u = tg.initDataUnsafe?.user || {id: 777, first_name: "Игрок"};
    document.getElementById('un').innerText = "⚔️ " + u.first_name;

    // Состояние игры
    let s = { 
        bl: 0, 
        p: 1, 
        a: 0, 
        cP: 50, 
        cA: 150, 
        energy: 300, 
        maxEnergy: 300 
    };

    let timerActive = false;
    let clicksThisSession = 0;

    const saved = localStorage.getItem('cw_v2_energy');
    if (saved) s = {...s, ...JSON.parse(saved)};

    function upd() {
        document.getElementById('bl').innerText = Math.floor(s.bl).toLocaleString();
        document.getElementById('b1').innerText = s.cP;
        document.getElementById('b2').innerText = s.cA;
        document.getElementById('b1').disabled = s.bl < s.cP;
        document.getElementById('b2').disabled = s.bl < s.cA;
        
        // Обновление полосы энергии
        const percent = (s.energy / s.maxEnergy) * 100;
        document.getElementById('energy-bar').style.width = percent + "%";
        document.getElementById('energy-text').innerText = `${Math.floor(s.energy)} / ${s.maxEnergy}`;
        
        localStorage.setItem('cw_v2_energy', JSON.stringify(s));
    }

    async function save() {
        try { await sb.from('leaderboard').upsert({ id: u.id, name: u.first_name, score: Math.floor(s.bl) }); } catch(e) {}
    }

    function hit(e) {
        if(e.type==='touchstart') e.preventDefault();
        if(s.energy < s.p) return; // Нет энергии - нет клика

        s.energy -= s.p;
        s.bl += s.p;
        clicksThisSession++;

        // Запуск таймера после первых кликов
        if (!timerActive && clicksThisSession >= 1) {
            timerActive = true;
            startRegen();
        }

        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        
        const d = document.createElement('div');
        d.className='dmg'; d.innerText=`+${s.p}`;
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        d.style.left=`${x - 20}px`; d.style.top=`${y - 20}px`;
        document.body.appendChild(d);
        setTimeout(()=>d.remove(), 800);
        
        upd();
    }

    // Регенерация энергии (таймер)
    function startRegen() {
        setInterval(() => {
            if (s.energy < s.maxEnergy) {
                s.energy += 1; // Скорость восстановления
                if (s.energy > s.maxEnergy) s.energy = s.maxEnergy;
                upd();
            }
        }, 1000);
    }

    function buy(t) {
        if(t==='p' && s.bl>=s.cP){ s.bl-=s.cP; s.p++; s.cP=Math.floor(s.cP*1.6); }
        if(t==='a' && s.bl>=s.cA){ s.bl-=s.cA; s.a++; s.cA=Math.floor(s.cA*1.8); }
        upd();
        save();
    }

    async function showRank() {
        document.getElementById('ov').style.display='block';
        const l = document.getElementById('list');
        l.innerText = "Загрузка...";
        try {
            const { data, error } = await sb.from('leaderboard').select('*').order('score', {ascending: false}).limit(10);
            if (error) throw error;
            l.innerHTML = data.map((p,i)=>`
                <div class="item" style="${p.id == u.id ? 'background:rgba(255,215,0,0.1);border-radius:10px;' : ''}">
                    <span>${i+1}. ${p.name}</span>
                    <b style="color:#ffd700">${(p.score || 0).toLocaleString()}</b>
                </div>`).join('');
        } catch(e) { l.innerText = "Ошибка доступа"; }
    }

    // Автоклик (тоже тратит энергию, но приносит монеты)
    setInterval(() => { 
        if(s.a > 0 && s.energy >= s.a) { 
            s.energy -= s.a; 
            s.bl += s.a; 
            upd(); 
        } 
    }, 1000);

    setInterval(save, 15000);
    upd();
</script>
</body>
</html>
