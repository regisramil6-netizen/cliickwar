<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CLICKWAR ULTIMATE FIX</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --accent: #ff4d4d; --gold: #ffd700; }
        body { 
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%); 
            color: white; font-family: 'Segoe UI', sans-serif; 
            text-align: center; margin: 0; padding: 15px; 
            overflow: hidden; user-select: none;
            touch-action: manipulation;
        }
        
        /* ШАПКА */
        .header-box { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 50; }
        .user-info { display: flex; align-items: center; background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; border: 1px solid #444; }
        .user-avatar { width: 30px; height: 30px; border-radius: 50%; margin-right: 8px; border: 1px solid var(--accent); }
        
        .circle-btn { background: rgba(255,255,255,0.1); border: 1px solid #444; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; }

        /* СТАТИСТИКА */
        .stats-panel { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 15px; border: 1px solid #333; margin: 10px 0; }
        .balance { color: var(--gold); font-size: 32px; font-weight: bold; }
        .energy-container { width: 100%; height: 12px; background: #222; border-radius: 10px; margin-top: 8px; overflow: hidden; border: 1px solid #444; }
        #energy-bar { width: 100%; height: 100%; background: linear-gradient(90deg, var(--accent), #ff8e8e); transition: width 0.3s ease; }

        /* БОСС */
        #flash { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle, rgba(255,215,0,0.2) 0%, transparent 70%); opacity: 0; pointer-events: none; z-index: 5; }
        #boss-container { position: relative; z-index: 10; margin: 20px 0; }
        #boss { width: 200px; transition: transform 0.1s; -webkit-tap-highlight-color: transparent; }
        #boss:active { transform: scale(0.85); }

        /* МАГАЗИН */
        .shop { display: flex; gap: 10px; z-index: 20; position: relative; }
        .card { background: #222; border: 1px solid #444; padding: 10px; border-radius: 15px; flex: 1; }
        .card button { background: #28a745; color: white; border: none; padding: 8px; width: 100%; border-radius: 8px; font-weight: bold; margin-top: 5px; }

        /* МОДАЛЬНЫЕ ОКНА (ГЛАВНОЕ ИСПРАВЛЕНИЕ ТУТ) */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); 
            z-index: 10000; /* Самый высокий приоритет */
            padding: 20px; box-sizing: border-box; 
        }
        .modal-content { 
            background: #1a1a1a; 
            border: 2px solid var(--accent); 
            border-radius: 25px; 
            padding: 20px; 
            margin-top: 50px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .day-box { background: #333; padding: 10px; border-radius: 10px; margin: 5px; display: inline-block; width: 60px; font-size: 10px; border: 1px solid #555; }
        .day-box.active { border-color: var(--gold); background: rgba(255,215,0,0.1); }
        
        .dmg { position: fixed; color: var(--gold); font-weight: bold; font-size: 28px; pointer-events: none; animation: fly 0.6s forwards; z-index: 5000; }
        @keyframes fly { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-80px); } }
    </style>
</head>
<body>

<div id="flash"></div>

<div class="header-box">
    <div class="user-info" onclick="showModal('profile-modal')">
        <img id="avatar" class="user-avatar" src="https://img.icons8.com/ios-filled/50/ff4d4d/user-male-circle.png">
        <span id="un">Загрузка...</span>
    </div>
    <div style="display:flex; gap:10px;">
        <div class="circle-btn" onclick="showModal('bonus-modal')">🎁</div>
        <div class="circle-btn" onclick="showModal('rank-modal')">🏆</div>
    </div>
</div>

<div class="stats-panel">
    <div class="balance">🪙 <span id="bl">0</span></div>
    <div class="energy-container"><div id="energy-bar"></div></div>
    <div style="font-size:12px; margin-top:5px;"><span id="cur-e">0</span> / <span id="max-e">300</span></div>
</div>

<div id="boss-container">
    <img id="boss" src="boss.png" ontouchstart="hit(event)">
</div>

<div class="shop">
    <div class="card">Урон <button id="b1" onclick="buy('p')">50</button></div>
    <div class="card">Лимит <button id="b2" onclick="buy('e')">100</button></div>
</div>

<div id="profile-modal" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--accent)">ПРОФИЛЬ</h2>
        <p>Рефералы: <b id="st-refs">0</b></p>
        <button onclick="copyRef()" style="background:#0088cc; padding:10px; color:white; border:none; border-radius:10px; width:100%">СКОПИРОВАТЬ ССЫЛКУ</button>
        <button onclick="closeModal('profile-modal')" style="margin-top:20px; background:#444; border:none; color:white; padding:10px; width:100%; border-radius:10px;">ЗАКРЫТЬ</button>
    </div>
</div>

<div id="bonus-modal" class="modal">
    <div class="modal-content">
        <h2>ЕЖЕДНЕВНЫЙ БОНУС</h2>
        <div id="bonus-grid"></div>
        <button id="claim-btn" onclick="claimDaily()" style="background:var(--gold); color:black; padding:12px; border:none; border-radius:10px; width:100%; font-weight:bold; margin-top:15px;">ЗАБРАТЬ</button>
        <button onclick="closeModal('bonus-modal')" style="margin-top:10px; background:#444; border:none; color:white; padding:10px; width:100%; border-radius:10px;">ЗАКРЫТЬ</button>
    </div>
</div>

<div id="rank-modal" class="modal">
    <div class="modal-content">
        <h2>🏆 ТОП ИГРОКОВ</h2>
        <div id="rank-list" style="text-align:left; margin-bottom:15px;">Загрузка...</div>
        <button onclick="closeModal('rank-modal')" style="background:#444; border:none; color:white; padding:10px; width:100%; border-radius:10px;">ЗАКРЫТЬ</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const sb = supabase.createClient("https://oniwtglhvsczfmgijeco.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uaXd0Z2xodnNjemZtZ2lqZWNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNjMzNTgsImV4cCI6MjA4NjczOTM1OH0.2ETnTI6c7Lw1qKvarX5fDp1RXyvBz8cqlR7YYyjYzHs");

    const user = tg.initDataUnsafe?.user || {id: 777, first_name: "Игрок"};
    document.getElementById('un').innerText = user.first_name;

    let s = { 
        bl: 0, p: 1, cP: 50, e: 300, maxE: 300, cE: 100, 
        lastBonus: 0, bonusDay: 0, refs: 0, lastExit: Date.now()
    };

    const rewards = [10, 20, 50, 100, 200, 500, 1000];

    async function loadData() {
        const local = localStorage.getItem('cw_v12');
        if (local) s = {...s, ...JSON.parse(local)};

        const { data } = await sb.from('leaderboard').select('*').eq('id', user.id).single();
        if (data) {
            s.bl = data.score || s.bl;
            s.refs = data.refs || 0;
            s.maxE = data.maxE || 300;
        }

        // Офлайн восстановление
        const offlineSec = Math.floor((Date.now() - s.lastExit) / 1000);
        const recovery = (offlineSec / 5) * (s.maxE * 0.01);
        s.e = Math.min(s.maxE, s.e + recovery);

        upd();
    }

    function upd() {
        s.lastExit = Date.now();
        document.getElementById('bl').innerText = Math.floor(s.bl).toLocaleString();
        document.getElementById('cur-e').innerText = Math.floor(s.e);
        document.getElementById('max-e').innerText = s.maxE;
        document.getElementById('energy-bar').style.width = (s.e / s.maxE * 100) + "%";
        
        document.getElementById('b1').innerText = s.cP;
        document.getElementById('b2').innerText = s.cE;
        document.getElementById('st-refs').innerText = s.refs;
        
        localStorage.setItem('cw_v12', JSON.stringify(s));
    }

    function hit(e) {
        if(s.e < s.p) return;
        s.e -= s.p; s.bl += s.p;

        const f = document.getElementById('flash');
        f.style.opacity = "1"; setTimeout(() => f.style.opacity = "0", 80);

        const d = document.createElement('div');
        d.className='dmg'; d.innerText=`+${s.p}`;
        d.style.left=`${e.touches[0].clientX}px`; d.style.top=`${e.touches[0].clientY}px`;
        document.body.appendChild(d); setTimeout(()=>d.remove(), 600);

        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        upd();
    }

    function buy(type) {
        if(type === 'p' && s.bl >= s.cP) { s.bl -= s.cP; s.p++; s.cP = Math.floor(s.cP * 1.6); }
        if(type === 'e' && s.bl >= s.cE) { s.bl -= s.cE; s.maxE += 20; s.e += 20; s.cE = Math.floor(s.cE * 1.7); }
        upd(); saveDB();
    }

    async function saveDB() {
        try { await sb.from('leaderboard').upsert({ id: user.id, name: user.first_name, score: Math.floor(s.bl), refs: s.refs, maxE: s.maxE }); } catch(e) {}
    }

    // ЛОГИКА ОКОН
    function showModal(id) {
        document.getElementById(id).style.display = 'block';
        if(id === 'rank-modal') loadRank();
        if(id === 'bonus-modal') renderBonuses();
    }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    async function loadRank() {
        const list = document.getElementById('rank-list');
        const { data } = await sb.from('leaderboard').select('*').order('score', {ascending: false}).limit(10);
        if(data) {
            list.innerHTML = data.map((u, i) => `<div>${i+1}. ${u.name} - 🪙${u.score}</div>`).join('');
        }
    }

    function renderBonuses() {
        const grid = document.getElementById('bonus-grid');
        grid.innerHTML = rewards.map((r, i) => `<div class="day-box ${s.bonusDay === i ? 'active' : ''}">День ${i+1}<br>+${r}</div>`).join('');
        
        const btn = document.getElementById('claim-btn');
        const diff = (s.lastBonus + 86400000) - Date.now();
        if(diff > 0) {
            btn.disabled = true;
            btn.style.background = "#555";
            const h = Math.floor(diff/3600000);
            const m = Math.floor((diff%3600000)/60000);
            btn.innerText = `${h}ч ${m}м`;
        } else {
            btn.disabled = false;
            btn.style.background = "var(--gold)";
            btn.innerText = "ЗАБРАТЬ";
        }
    }

    function claimDaily() {
        s.bl += rewards[s.bonusDay];
        s.lastBonus = Date.now();
        s.bonusDay = (s.bonusDay + 1) % 7;
        upd(); renderBonuses(); saveDB();
    }

    function copyRef() {
        const link = `https://t.me/ClickWarBot_bot/app?startapp=${user.id}`;
        navigator.clipboard.writeText(link);
        tg.showAlert("Ссылка скопирована!");
    }

    setInterval(() => { if(s.e < s.maxE) { s.e = Math.min(s.maxE, s.e + (s.maxE * 0.01)); upd(); } }, 5000);
    loadData();
</script>
</body>
            </html>
