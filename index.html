<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CLICKWAR ELITE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            margin: 0; padding: 15px;
            overflow: hidden;
            user-select: none;
        }

        /* Хедер игрока */
        .user-header {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 15px;
            display: inline-flex;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        h1 { color: #ff4d4d; text-shadow: 0 0 15px #ff4d4d; margin: 5px 0; font-size: 26px; }

        /* Босс и эффекты */
        #boss-container {
            position: relative;
            display: inline-block;
            margin: 40px 0;
        }

        #boss {
            width: 240px;
            position: relative;
            z-index: 10;
            cursor: pointer;
            transition: transform 0.05s;
            -webkit-tap-highlight-color: transparent;
        }
        #boss:active { transform: scale(0.92); }

        .magic-circle {
            position: absolute; top: 50%; left: 50%;
            width: 360px; height: 360px;
            margin-top: -180px; margin-left: -180px;
            background: url('https://img.icons8.com/ios/150/ff4d4d/sacred-geometry.png') no-repeat center;
            background-size: contain; opacity: 0.25;
            animation: rotateCircle 15s linear infinite;
        }

        .aura {
            position: absolute; top: 50%; left: 50%;
            width: 200px; height: 200px;
            margin-top: -100px; margin-left: -100px;
            box-shadow: 0 0 70px 25px rgba(255, 77, 77, 0.4);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes rotateCircle { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.3); opacity: 0.7; } }

        /* Статистика */
        .stats-panel {
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid #444;
            margin-bottom: 20px;
        }
        .bal-text { color: #ffd700; font-size: 24px; font-weight: bold; margin-top: 5px; }

        /* Магазин */
        .shop { display: flex; justify-content: center; gap: 10px; }
        .upgrade-card {
            background: #1a1a1a; border: 1px solid #333;
            padding: 12px; border-radius: 15px; width: 140px;
        }
        .upgrade-card button {
            background: #28a745; color: white; border: none;
            padding: 8px; border-radius: 8px; width: 100%;
            margin-top: 5px; font-weight: bold; cursor: pointer;
        }
        .upgrade-card button:disabled { background: #444; color: #888; }

        /* Анимация урона */
        .damage-text {
            position: absolute; color: #ff4d4d; font-weight: bold;
            font-size: 28px; pointer-events: none; z-index: 100;
            text-shadow: 0 0 5px #000;
            animation: floatDamage 0.8s ease-out forwards;
        }
        @keyframes floatDamage {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.4); }
        }
    </style>
</head>
<body>

<div class="user-header">
    <span id="user-display">⚔️ Игрок</span>
</div>

<h1>🔥 CLICKWAR 🔥</h1>

<div class="stats-panel">
    <div>❤️ HP: <span id="hp">1,000,000</span></div>
    <div class="bal-text">🪙 <span id="bal">0</span> CW</div>
</div>

<div id="boss-container">
    <div class="magic-circle"></div>
    <div class="aura"></div>
    <img id="boss" src="boss.png" alt="Boss" onmousedown="handleHit(event)" ontouchstart="handleHit(event)">
</div>

<div class="shop">
    <div class="upgrade-card">
        <span style="font-size: 12px; opacity: 0.7;">Урон +1</span>
        <button id="btn-pwr" onclick="buy('pwr')">50</button>
    </div>
    <div class="upgrade-card">
        <span style="font-size: 12px; opacity: 0.7;">Авто +1</span>
        <button id="btn-auto" onclick="buy('auto')">150</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    // Имя игрока
    if (tg.initDataUnsafe?.user) {
        document.getElementById('user-display').innerText = `⚔️ ${tg.initDataUnsafe.user.first_name}`;
    }

    // Состояние игры
    let state = {
        hp: 1000000,
        bal: 0,
        pwr: 1,
        auto: 0,
        costPwr: 50,
        costAuto: 150
    };

    // Загрузка сохранений
    const saved = localStorage.getItem('cw_final_save');
    if (saved) state = JSON.parse(saved);

    function updateUI() {
        document.getElementById('hp').innerText = Math.floor(state.hp).toLocaleString();
        document.getElementById('bal').innerText = Math.floor(state.bal).toLocaleString();
        document.getElementById('btn-pwr').innerText = state.costPwr;
        document.getElementById('btn-auto').innerText = state.costAuto;
        
        document.getElementById('btn-pwr').disabled = state.bal < state.costPwr;
        document.getElementById('btn-auto').disabled = state.bal < state.costAuto;
        
        localStorage.setItem('cw_final_save', JSON.stringify(state));
    }

    function handleHit(e) {
        e.preventDefault(); // Защита от двойного тапа и скролла
        
        state.hp -= state.pwr;
        state.bal += state.pwr;
        
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

        // Создаем текст урона
        const text = document.createElement('div');
        text.className = 'damage-text';
        text.innerText = `-${state.pwr}`;
        
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        
        text.style.left = `${x - 20}px`;
        text.style.top = `${y - 40}px`;
        
        document.body.appendChild(text);
        setTimeout(() => text.remove(), 800);
        
        updateUI();
    }

    function buy(type) {
        if (type === 'pwr' && state.bal >= state.costPwr) {
            state.bal -= state.costPwr;
            state.pwr += 1;
            state.costPwr = Math.floor(state.costPwr * 1.6);
        } else if (type === 'auto' && state.bal >= state.costAuto) {
            state.bal -= state.costAuto;
            state.auto += 1;
            state.costAuto = Math.floor(state.costAuto * 1.8);
        }
        updateUI();
    }

    // Авто-урон
    setInterval(() => {
        if (state.auto > 0) {
            state.hp -= state.auto;
            state.bal += state.auto;
            updateUI();
        }
    }, 1000);

    updateUI();
</script>

</body>
</html>
